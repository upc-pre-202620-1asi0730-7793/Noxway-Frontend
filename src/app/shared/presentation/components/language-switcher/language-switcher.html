<div
  class="nx-lang-switch"
  role="group"
  [attr.aria-label]="languageService.currentLang() === 'en' ? 'Language selector' : 'Selector de idioma'">
  <button
    type="button"
    class="nx-lang-btn"
    [class.active]="languageService.currentLang() === 'es'"
    [attr.aria-pressed]="languageService.currentLang() === 'es'"
    (click)="selectLanguage('es')">
    ES
  </button>
  <button
    type="button"
    class="nx-lang-btn"
    [class.active]="languageService.currentLang() === 'en'"
    [attr.aria-pressed]="languageService.currentLang() === 'en'"
    (click)="selectLanguage('en')">
    EN
  </button>
</div>
