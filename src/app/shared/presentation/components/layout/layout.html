<div class="app-shell">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">
        ◆
      </div>

      <div>
        <h1>Noxway</h1>
        <span>BY NOCTIVA · 2026</span>
      </div>
    </div>

    <div class="user-card">
      <div class="avatar">
        NU
      </div>

      <div class="user-info">
        <strong>Usuario Noxway</strong>
        <span>Trabajador Nocturno</span>
      </div>
    </div>

    <p class="menu-title">
      MÓDULOS DEL TRABAJADOR
    </p>

    <nav class="navigation">

      @for (option of options; track option.link) {

        <a
          [routerLink]="option.link"
          routerLinkActive="active"
          class="nav-item">

          <mat-icon class="nav-dot">
            {{ option.icon }}
          </mat-icon>

          <span class="nav-label">
            {{ option.label }}
          </span>

          @if (option.badge) {
            <span
              class="badge"
              [class.success]="option.badgeClass === 'success'"
              [class.danger]="option.badgeClass === 'danger'">

              {{ option.badge }}

            </span>
          }

        </a>

      }

    </nav>

    <div class="sidebar-footer">
      <button class="sos-button">
        ⚠ ALERTA SOS
      </button>
    </div>

  </aside>

  <section class="main-shell">

    <header class="topbar">

      <div class="page-title">
        Dashboard del Trabajador
      </div>

      <div class="network-status">
        <span class="status-dot"></span>
        Red Nocturna Activa 24h
      </div>

      <div class="topbar-actions">

        <div class="clock">
          🕒 Hora local
        </div>

        <button
          class="notification-button"
          aria-label="Notificaciones">
          <span></span>
        </button>

        <button class="logout-button">
          Salir ↗
        </button>

      </div>

    </header>

    <main class="content">
      <router-outlet/>
    </main>

  </section>

</div>
